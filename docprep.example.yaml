# docprep configuration
# Copy to docprep.yaml and customize as needed.

pipeline:
  vlm_preset: granite_docling       # granite_docling | custom HF model path
  ocr_languages: [en]               # languages for OCR (EasyOCR language codes)
  embed_images: true                # embed images as base64 in markdown (true) or leave <!-- image --> placeholders (false)
  render_chart_images: true         # render Excel charts as images (requires LibreOffice/soffice on PATH)
  describe_images: true             # send images to VLM for text interpretation (uses fallback endpoint)
  picture_judge_prompt: "Look at this image and classify it as one of: \"text_only\" (the image contains only text that can be OCR'd) or \"needs_interpretation\" (the image contains charts, diagrams, figures, photos, or other visual elements). Respond with only the label, nothing else."
  picture_ocr_prompt: "Extract all text from this image. Preserve reading order, headings, and list structure. Output only the extracted text, no commentary."
  picture_interpret_prompt: "Convert this image to Markdown. Preserve all text, tables, and reading order. Describe any charts or figures in detail. Output only the Markdown content, no commentary."
  picture_description_timeout: 60   # seconds per image API call
  picture_description_concurrency: 1
  picture_area_threshold: 0.01      # min fraction of page area to describe (smaller = more images described)

quality_gate:
  min_text_density: 50              # min chars per page before escalation
  max_garbled_ratio: 0.20           # max fraction of non-printable characters

fallback:
  enabled: true
  provider: mistral                 # mistral | openai | gemini | anthropic | ollama
  model:                             # VLM model name (required for ollama, ignored by others)
  base_url:                          # OpenAI-compatible endpoint (required for ollama, ignored by others)
  max_pages: 50                     # max pages to send to VLM API
  timeout_seconds: 30               # timeout per API call

# API keys are read from environment variables:
#   MISTRAL_API_KEY
#   OPENAI_API_KEY
#   GEMINI_API_KEY
#   ANTHROPIC_API_KEY
#   OLLAMA_API_KEY
#
# Example: Ollama fallback (local or remote OpenAI-compatible endpoint)
# fallback:
#   enabled: true
#   provider: ollama
#   model: llama3.2-vision           # any vision-capable Ollama model
#   base_url: http://localhost:11434/v1
#   max_pages: 50
#   timeout_seconds: 30
#
# model and base_url may also be set via environment variables:
#   DOCPREP_FALLBACK_MODEL
#   DOCPREP_FALLBACK_BASE_URL
