[project]
name = "docprep"
version = "0.1.0"
description = "Document preprocessing pipeline — converts any common document format to Markdown for LLM/RAG ingestion"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "docling>=2.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "python-magic>=0.4",
    "pymupdf>=1.25",
]

[project.optional-dependencies]
mistral = ["mistralai"]
openai = ["openai>=1.0"]
gemini = ["google-genai"]
anthropic = ["anthropic>=0.40"]
ollama = ["openai>=1.0"]
all = ["docprep[mistral,openai,gemini,anthropic,ollama]"]
dev = [
    "pytest>=7.0",
    "pytest-mock",
    "ruff",
]

[project.scripts]
docprep = "docprep.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires docling and real document fixtures",
    "api: requires external API keys",
]
